[package]
    description = "Lightbulb: modern ML inference/training runner on Candle"
    edition     = "2024"
    license     = "MIT OR Apache-2.0"
    name        = "lightbulb"
    repository  = "https://github.com/ciresnave/lightbulb"
    version     = "0.1.0"

[features]
    # CUDA support with flash attention and fused kernels.
    #
    # This MUST propagate to `fuel` as well as `candlelight`. Fuel's own
    # `default = []` is its clean CPU-testing baseline, not a consumer default —
    # a consumer that wants multi-backend planning has to opt in, and omitting
    # the feature produces a binary with zero GPU code in it. While this read
    # `["candlelight/cuda"]` alone, there was NO build configuration in which
    # `model_fuel` could reach a GPU: enabling `cuda` accelerated the candlelight
    # path we are porting AWAY from and left the Fuel path CPU-only. These
    # feature lines predate `fuel` being a dependency at all, and nobody extended
    # them when it was added.
    cuda = ["candlelight/cuda", "fuel/cuda"]
    # Fuel's CUDA backend ALONE, without candlelight's.
    #
    # Needed because the two are independently breakable and, during the port,
    # independently interesting. `candlelight/cuda` currently does not build on
    # this toolchain at all: `candle-kernels v0.10.2`'s build script fails under
    # CUDA 13.3, whose CCCL headers hard-error on MSVC's traditional
    # preprocessor ("pass /Zc:preprocessor"). That is a pre-existing breakage in
    # the path we are porting AWAY from — it predates the `fuel/cuda` wiring
    # above and would fail identically with `cuda = ["candlelight/cuda"]` alone.
    #
    # Coupling both into one flag means candlelight's breakage blocks any
    # experiment on Fuel's backend, which is exactly backwards for a port whose
    # goal is retiring candlelight. Use this to exercise the Fuel path.
    #
    # Also pulls the dev-only `fuel-cuda-backend` so the GPU measurement harness
    # can construct a `CudaDevice`; see the dev-dependency comment.
    fuel-cuda = ["fuel/cuda", "dep:fuel-cuda-backend"]
    # Vulkan, via Fuel only — candlelight has no Vulkan backend. Worth having
    # separately because Fuel supports it and it reaches integrated GPUs that
    # CUDA cannot.
    vulkan = ["fuel/vulkan"]
    default = []
    # Flash attention feature (requires CUDA)
    flash-attn = ["candlelight/flash-attn"]
    # Layer norm optimization (requires CUDA)
    layer-norm = ["candlelight/layer-norm"]
    # All CUDA optimizations
    cuda-full = ["candlelight/cuda-full"]
    metal = ["candlelight/metal"]
    
    # Debug output categories - enable individually or use debug-all
    debug-all = ["debug-prefill", "debug-decode", "debug-attention", "debug-cache", "debug-rope", "debug-mlp", "debug-chunking", "debug-engine", "debug-attention-scores"]
    debug-prefill = []
    debug-decode = []
    debug-attention = []
    debug-attention-scores = []
    debug-cache = []
    debug-rope = []
    debug-mlp = []
    debug-chunking = []
    debug-engine = []

[dependencies]
    ahash              = "0.8"
    anyhow             = "1"
    bytemuck           = "1.14"
    clap               = { version = "4", features = ["derive"] }
    ggml-quants        = "0.1.0"
    memmap2            = "0.9"
    parking_lot        = "0.12"
    rand               = "0.9"
    rayon              = "1.10"
    regex              = "1"
    serde              = { version = "1", features = ["derive"] }
    serde_json         = "1"
    sha2               = "0.10"
    thiserror          = "2"
    tokenizers         = { version = "0.21", default-features = false, features = ["onig"] }
    tokio              = { version = "1", features = ["macros", "rt-multi-thread"] }
    tokio-stream       = "0.1"
    tracing            = "0.1"
    tracing-subscriber = { version = "0.3", features = ["env-filter"] }
    uuid               = { version = "1.0", features = ["v4", "serde"] }

    # HTTP API dependencies
    axum               = { version = "0.8", features = ["tokio"] }
    axum-macros        = "0.5"
    hyper              = { version = "1.0", features = ["server", "http1", "http2"] }
    chrono             = { version = "0.4", features = ["serde"] }
    futures            = "0.3"
    futures-util       = "0.3"
    hex                = "0.4"
    reqwest            = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-manual-roots"] }
    tokio-postgres     = "0.7"
    deadpool-postgres  = "0.14"
    refinery           = { version = "0.9", features = ["tokio-postgres"] }
    postgres-types     = { version = "0.2", features = ["derive", "with-chrono-0_4", "with-uuid-1"] }
    tower-http         = { version = "0.6", features = ["cors", "trace"] }

    # TLS/Certificate dependencies
    tokio-rustls       = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
    rustls             = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12", "std"] }
    ring               = "0.17"
    rustls-pemfile     = "2.1"
    rcgen              = { version = "0.14", default-features = false, features = ["ring"] }
    instant-acme       = { version = "0.8", default-features = false, features = ["ring"] }
    x509-parser        = "0.18"
    time               = { version = "0.3", features = ["parsing", "formatting"] }
    base64             = "0.22"
    hyper-util         = { version = "0.1", features = ["tokio", "server", "service"] }
    tower              = { version = "0.5", features = ["util"] }
    http-body-util     = "0.1"

    # Hugging Face Hub integration for model downloading
    hf-hub             = "0.4"

    # Configuration management
    distributed-config = "0.1"

    # Model Context Protocol implementation
    mocopr = "0.1"

    # Hardware detection and system analysis
    system-analysis = "0.2"

    # Candlelight - Unified Candle ML framework wrapper
    # Candlelight defaults enable flash-attn/cudnn/cuda; Lightbulb gates those
    # behind its own features, so it takes candlelight bare.
    candlelight = { git = "https://github.com/ciresnave/candlelight", default-features = false }
    
    # MLMF removed 2026-07-29. Every published version (crates.io 0.2.0, the
    # v0.2.1 tag, and 0.3.0 at HEAD) depends on candle-core/candle-nn 0.9.2
    # directly, not on candlelight — so its `VarBuilder` was a different type
    # than `Llama::load` accepts, and `load_local_llama` could not compile.
    # MLMF additionally requires `protoc` at build time. Weight loading now
    # goes through candlelight's `VarBuilder::from_mmaped_safetensors`, the
    # pattern `load_awq_llama` already used. See src/loaders/mod.rs.

    # Fuel — the ML framework Lightbulb is porting ONTO. Lives alongside
    # candlelight during the port; candlelight is deleted once model_fuel/
    # reaches parity (see docs/superpowers/specs/2026-07-28-fuel-port-design.md).
    #
    # MUST be the git dependency: `fuel-core` on crates.io is an UNRELATED
    # project (the Fuel blockchain client, v0.48.x). `cargo add fuel-core`
    # silently pulls the wrong crate.
    # PATH deps to a local worktree during the port, deliberately: the git
    # dependency works but re-clones a very large workspace into cargo's cache,
    # and this tree is already on disk and tracks origin/main. Switch to the git
    # form (`{ git = "https://github.com/ciresnave/fuel", package = "fuel-core" }`)
    # before anything is published or built elsewhere.
    fuel             = { path = "C:/Projects/fuel-lightbulb-port/fuel-core", package = "fuel-core" }
    fuel-cpu-backend = { path = "C:/Projects/fuel-lightbulb-port/fuel-cpu-backend" }
    # Only used to CONSTRUCT a `CudaDevice` in the GPU measurement harness.
    # `fuel-core` provides `impl From<CudaDevice> for Device` (its `cuda_backend`
    # module) but re-exports only `builder_arg`, not `CudaDevice` itself — so a
    # consumer that wants to name a GPU must depend on the backend crate.
    #
    # A regular optional dependency rather than a dev-dependency because Cargo
    # rejects optional dev-dependencies outright ("dev-dependencies are not
    # allowed to be optional"), and a PLAIN dev-dependency would run nvcc on
    # every `cargo test` including CPU-only ones. Optional + feature-activated
    # keeps default builds free of it entirely.
    fuel-cuda-backend = { path = "C:/Projects/fuel-lightbulb-port/fuel-cuda-backend", optional = true }

[[bin]]
name = "lightbulb-cli"
path = "src/bin/lightbulb-cli.rs"

[dev-dependencies]
# kiss-ref: spec-exact reference implementation of the KISS base-op vocabulary,
# used as the port's INDEPENDENT differential target (tiers 1 and 2 of the
# oracle). Differential target, never a verdict source — a disagreement means
# "determine which of us is wrong".
# 0.2.0 brings Node::ConstBits (exact bit patterns for tier-1 edge cases),
# R10-R14 reference fragments, and the ScalarFloat seal — the property that
# stops kiss-ref mirroring a consumer's own arithmetic back as agreement.
kiss-ref-core  = "0.2.0"
kiss-ops-vocab = "0.2.0"
# fuel-inference: the serving drivers (PagedSessionScheduler and friends).
# DEV-only on purpose — Lightbulb's library does not depend on Fuel's scheduler,
# it has its own. This is here so the A/B harness in tests/paged_plan_once.rs can
# drive Fuel's paged decode path directly and measure the plan-once flag.
fuel-inference = { path = "C:/Projects/fuel-lightbulb-port/fuel-inference" }
tempfile       = "3"
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64         = "0.22"
criterion      = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "batched_inference_benchmark"
harness = false
