[package]
    description = "Lightbulb: modern ML inference/training runner on Candle"
    edition     = "2024"
    license     = "MIT OR Apache-2.0"
    name        = "lightbulb"
    repository  = "https://github.com/ciresnave/lightbulb"
    version     = "0.1.0"

[features]
    cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "candle-flash-attn", "candle-transformers/flash-attn", "candle-layer-norm"]
    default = []
    # Legacy flash-attn feature for backwards compatibility - now included in cuda
    flash-attn = ["cuda"]
    metal = [
        "candle-core/metal",
        "candle-nn/metal",
        "candle-transformers/metal",
    ]
    
    # Debug output categories - enable individually or use debug-all
    debug-all = ["debug-prefill", "debug-decode", "debug-attention", "debug-cache", "debug-rope", "debug-mlp", "debug-chunking", "debug-engine", "debug-attention-scores"]
    debug-prefill = []
    debug-decode = []
    debug-attention = []
    debug-attention-scores = []
    debug-cache = []
    debug-rope = []
    debug-mlp = []
    debug-chunking = []
    debug-engine = []

[dependencies]
    ahash              = "0.8"
    anyhow             = "1"
    bytemuck           = "1.14"
    clap               = { version = "4", features = ["derive"] }
    ggml-quants        = "0.1.0"
    memmap2            = "0.9"
    parking_lot        = "0.12"
    rand               = { version = "0.8", features = ["small_rng"] }
    rayon              = "1.10"
    regex              = "1"
    serde              = { version = "1", features = ["derive"] }
    serde_json         = "1"
    sha2               = "0.10"
    thiserror          = "2"
    tokenizers         = "0.22"
    tokio              = { version = "1", features = ["macros", "rt-multi-thread"] }
    tokio-stream       = "0.1"
    tracing            = "0.1"
    tracing-subscriber = { version = "0.3", features = ["env-filter"] }
    uuid               = { version = "1.0", features = ["v4", "serde"] }

    # HTTP API dependencies
    axum               = { version = "0.8", features = ["tokio"] }
    axum-macros        = "0.5"
    chrono             = { version = "0.4", features = ["serde"] }
    futures            = "0.3"
    futures-util       = "0.3"
    hex                = "0.4"
    reqwest            = { version = "0.12", features = ["json", "stream"] }
    tokio-postgres     = "0.7"
    deadpool-postgres  = "0.14"
    refinery           = { version = "0.9", features = ["tokio-postgres"] }
    postgres-types     = { version = "0.2", features = ["derive", "with-chrono-0_4", "with-uuid-1"] }
    tower-http         = { version = "0.6", features = ["cors", "trace"] }

    # TLS/Certificate dependencies
    tokio-rustls       = "0.26"
    rustls             = "0.23"
    rustls-pemfile     = "2.1"
    rcgen              = "0.14"
    instant-acme       = "0.8"
    x509-parser        = "0.18"
    time               = { version = "0.3", features = ["parsing", "formatting"] }
    axum-server        = { version = "0.7", features = ["tls-rustls"] }
    base64             = "0.22"

    # Configuration management
    distributed-config = { workspace = true }

    # Model Context Protocol implementation
    mocopr = { workspace = true }

    # Hardware detection and system analysis
    system-analysis = { workspace = true }

    # Upstream Candle crates (pin to a released version; adjust as needed)
    candle-core         = { git = "https://github.com/huggingface/candle", package = "candle-core", rev = "9fe623237a515f95f70d117c0a6da610c28a5ecd" }
    candle-nn           = { git = "https://github.com/huggingface/candle", package = "candle-nn", rev = "9fe623237a515f95f70d117c0a6da610c28a5ecd" }
    candle-transformers = { git = "https://github.com/huggingface/candle", package = "candle-transformers", rev = "9fe623237a515f95f70d117c0a6da610c28a5ecd" }
    
    # FlashAttention-2 support (optional, requires CUDA and flash-attn feature)
    candle-flash-attn = { git = "https://github.com/huggingface/candle", package = "candle-flash-attn", rev = "9fe623237a515f95f70d117c0a6da610c28a5ecd", optional = true }
    
    # Fused LayerNorm/RMSNorm kernels (optional, requires CUDA)
    candle-layer-norm = { git = "https://github.com/huggingface/candle-extensions", package = "candle-layer-norm", rev = "e287dd09535ab5d7631c0f2ae0a93d7ec168cb86", optional = true }

[[bin]]
name = "lightbulb-cli"
path = "src/bin/lightbulb-cli.rs"

[dev-dependencies]
tempfile       = "3"
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64         = "0.22"
