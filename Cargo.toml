[package]
    description = "Lightbulb: an ML inference and training runner with an OpenAI-compatible API"
    edition     = "2024"
    license     = "MIT OR Apache-2.0"
    name        = "lightbulb"
    repository  = "https://github.com/ciresnave/lightbulb"
    version     = "0.1.0"

[features]
    # CUDA support with flash attention and fused kernels.
    #
    # This MUST propagate to `fuel` as well as `candlelight`. Fuel's own
    # `default = []` is its clean CPU-testing baseline, not a consumer default —
    # a consumer that wants multi-backend planning has to opt in, and omitting
    # the feature produces a binary with zero GPU code in it. While this read
    # `["candlelight/cuda"]` alone, there was NO build configuration in which
    # `model_fuel` could reach a GPU: enabling `cuda` accelerated the candlelight
    # path we are porting AWAY from and left the Fuel path CPU-only. These
    # feature lines predate `fuel` being a dependency at all, and nobody extended
    # them when it was added.
    cuda = ["candlelight/cuda", "fuel/cuda"]
    # Fuel's CUDA backend ALONE, without candlelight's.
    #
    # Needed because the two are independently breakable and, during the port,
    # independently interesting. `candlelight/cuda` currently does not build on
    # this toolchain at all: `candle-kernels v0.10.2`'s build script fails under
    # CUDA 13.3, whose CCCL headers hard-error on MSVC's traditional
    # preprocessor ("pass /Zc:preprocessor"). That is a pre-existing breakage in
    # the path we are porting AWAY from — it predates the `fuel/cuda` wiring
    # above and would fail identically with `cuda = ["candlelight/cuda"]` alone.
    #
    # Coupling both into one flag means candlelight's breakage blocks any
    # experiment on Fuel's backend, which is exactly backwards for a port whose
    # goal is retiring candlelight. Use this to exercise the Fuel path.
    #
    # Also pulls the dev-only `fuel-cuda-backend` so the GPU measurement harness
    # can construct a `CudaDevice`; see the dev-dependency comment.
    fuel-cuda = ["fuel/cuda", "dep:fuel-cuda-backend"]
    # Vulkan, via Fuel only — candlelight has no Vulkan backend. Worth having
    # separately because Fuel supports it and it reaches integrated GPUs that
    # CUDA cannot.
    vulkan = ["fuel/vulkan"]
    # Serve through the Fuel path (`src/model_fuel/`) instead of candlelight.
    #
    # A BUILD-TIME choice rather than a runtime one, so one binary serves one
    # backend. Accepted cost: a candlelight/Fuel A/B needs two builds and two
    # processes. Acceptable because the acceptance gate asserts content over
    # HTTP rather than comparing the two runners — three of the four suites the
    # port design named as the parity oracle no longer compile.
    #
    # `--all-features` selects Fuel. That build is already broken for an
    # unrelated reason (`cuda` needs `candlelight/cuda`, whose candle-kernels
    # v0.10.2 build script fails under CUDA 13.3), so no working configuration
    # changes meaning.
    fuel-engine = []
    default = []
    # Flash attention feature (requires CUDA)
    flash-attn = ["candlelight/flash-attn"]
    # Layer norm optimization (requires CUDA)
    layer-norm = ["candlelight/layer-norm"]
    # All CUDA optimizations
    cuda-full = ["candlelight/cuda-full"]
    metal = ["candlelight/metal"]
    
    # Debug output categories - enable individually or use debug-all
    debug-all = ["debug-prefill", "debug-decode", "debug-attention", "debug-cache", "debug-rope", "debug-mlp", "debug-chunking", "debug-engine", "debug-attention-scores"]
    debug-prefill = []
    debug-decode = []
    debug-attention = []
    debug-attention-scores = []
    debug-cache = []
    debug-rope = []
    debug-mlp = []
    debug-chunking = []
    debug-engine = []

[dependencies]
    ahash              = "0.8"
    anyhow             = "1"
    bytemuck           = "1.14"
    clap               = { version = "4", features = ["derive"] }
    ggml-quants        = "0.1.0"
    memmap2            = "0.9"
    # Chat-template rendering. HuggingFace `chat_template` values are Jinja.
    # minijinja is pure Rust with no C dependencies, which keeps the CUDA build
    # unaffected.
    #
    # The feature list mirrors what `transformers` gives its own environment
    # (`utils/chat_template_utils.py`), because these templates are authored
    # against THAT dialect. Dropping one does not degrade rendering — it makes real
    # checkpoint templates fail to parse, which falls through to a registry guess
    # and reports success at a lower tier. That is the defect this work removes,
    # wearing a provenance field that says "guess".
    #
    #   macros        {% macro %}
    #   loop_controls {% break %} / {% continue %}  (transformers loads
    #                 jinja2.ext.loopcontrols for exactly this)
    #   json          the `tojson` filter
    #   serde         silences a deprecation warning; `context!` over serde types
    #                 is load-bearing here, not incidental
    #   debug         puts template source context into errors — spec §2 requires
    #                 a failing template log "which template failed and why"
    #
    # `loader` stays out: templates arrive as strings, never paths.
    minijinja          = { version = "2", features = ["macros", "loop_controls", "json", "serde", "debug"] }
    # Python method compatibility for the same templates. Jinja2's values ARE
    # Python objects, so `"x".startswith(...)`, `s.strip('\n')`, `s.split(...)`
    # and `d.items()` come free there; minijinja's do not, and it reports
    # "string has no method named startswith". Measured: Qwen3-8B's real
    # template fails at chat:20 without this, and Mistral-7B-Instruct-v0.3's
    # tools branch fails at `tool.items()`.
    #
    # `pycompat` is the module minijinja's own docs point at for this, wired
    # through `Environment::set_unknown_method_callback` in
    # `api/chat_template.rs`.
    #
    # Pinned to 2.23 rather than "2": `pycompat` did not exist in 2.0, and the
    # callback signature is tied to the `minijinja` version — both crates
    # resolve to the same 2.x release, so they must move together.
    minijinja-contrib  = { version = "2.23", features = ["pycompat"] }
    parking_lot        = "0.12"
    rand               = "0.9"
    rayon              = "1.10"
    regex              = "1"
    serde              = { version = "1", features = ["derive"] }
    serde_json         = "1"
    sha2               = "0.10"
    thiserror          = "2"
    tokenizers         = { version = "0.21", default-features = false, features = ["onig"] }
    tokio              = { version = "1", features = ["macros", "rt-multi-thread"] }
    tokio-stream       = "0.1"
    tracing            = "0.1"
    tracing-subscriber = { version = "0.3", features = ["env-filter"] }
    uuid               = { version = "1.0", features = ["v4", "serde"] }

    # HTTP API dependencies
    axum               = { version = "0.8", features = ["tokio"] }
    axum-macros        = "0.5"
    hyper              = { version = "1.0", features = ["server", "http1", "http2"] }
    chrono             = { version = "0.4", features = ["serde"] }
    futures            = "0.3"
    futures-util       = "0.3"
    hex                = "0.4"
    reqwest            = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-manual-roots"] }
    tokio-postgres     = "0.7"
    deadpool-postgres  = "0.14"
    refinery           = { version = "0.9", features = ["tokio-postgres"] }
    postgres-types     = { version = "0.2", features = ["derive", "with-chrono-0_4", "with-uuid-1"] }
    tower-http         = { version = "0.6", features = ["cors", "trace"] }

    # TLS/Certificate dependencies
    tokio-rustls       = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
    rustls             = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12", "std"] }
    ring               = "0.17"
    rustls-pemfile     = "2.1"
    rcgen              = { version = "0.14", default-features = false, features = ["ring"] }
    instant-acme       = { version = "0.8", default-features = false, features = ["ring"] }
    x509-parser        = "0.18"
    time               = { version = "0.3", features = ["parsing", "formatting"] }
    base64             = "0.22"
    hyper-util         = { version = "0.1", features = ["tokio", "server", "service"] }
    tower              = { version = "0.5", features = ["util"] }
    http-body-util     = "0.1"

    # Hugging Face Hub integration for model downloading
    hf-hub             = "0.4"

    # Configuration management
    distributed-config = "0.1"

    # Model Context Protocol implementation
    mocopr = "0.1"

    # Hardware detection and system analysis
    system-analysis = "0.2"

    # Candlelight - Unified Candle ML framework wrapper
    # Candlelight defaults enable flash-attn/cudnn/cuda; Lightbulb gates those
    # behind its own features, so it takes candlelight bare.
    # ⚠️ PINNED TO AN EXACT REV, and it was not. Measured 2026-09-05:
    #
    #   candlelight   git+.../candlelight#d70a03f3...           <- NO ?rev= : pins NOTHING
    #   fuel-core     git+.../fuel?rev=2d0c04b7...#2d0c04b7...  <- ?rev=    : pinned
    #
    # Without a `rev` this tracked candlelight's DEFAULT BRANCH, so a routine
    # `cargo update` moved it to any new commit with NO manifest edit. Cargo.lock
    # is tracked, so builds stayed reproducible and a move would show in a
    # lockfile diff — but nothing expressed intent and no check would notice.
    #
    # Pinned to the commit ALREADY RESOLVED, so this changes nothing about what
    # builds today. It converts a silent `cargo update` side effect into a
    # deliberate act that has to be written down. If someone wants it floating
    # again they unpin it and say why: that is a change with an author, where
    # today's state was a change with nobody.
    #
    # Found while answering vulkane's portfolio-wide question — "any 'is the pin
    # still current?' check that reads a MANIFEST instead of a LOCKFILE has a
    # hole, because a caret range absorbs the upgrade with no manifest edit."
    # Lightbulb has no such check at all (positive control: the same grep finds
    # 8 `cargo` hits in .github/workflows/ci.yml, so the null is over a searched
    # population). But the absence of the check is not the absence of the defect,
    # and a git dep with no rev is the worse form: their caret admits 0.1.1,
    # this admitted anything.
    #
    # ⚠️ ONE MORE FOUND BY THE SAME SWEEP AND NOT FIXABLE HERE:
    # `candle-layer-norm` is also unpinned
    # (`git+.../candle-layer-norm#1d488852...`, no `?rev=`), but it is a
    # TRANSITIVE dep of candlelight, not a direct one — its manifest belongs to
    # candlelight, so pinning it is not this crate's to do. Pinning candlelight
    # does not pin it: candlelight's own manifest still declares it loosely, so a
    # lockfile regeneration can still move it. Recorded rather than dropped,
    # because "we swept and pinned" would otherwise imply a completeness the
    # sweep does not have.
    #
    # The sweep itself, so it can be re-run: every unpinned git source in
    # Cargo.lock is one whose `source` has no `?rev=`, i.e.
    #   grep -oE 'git\+[^"#?]+#' Cargo.lock | sort -u
    # Two hits on 2026-09-05; one is fixed here and one is candlelight's.
    candlelight = { git = "https://github.com/ciresnave/candlelight", rev = "d70a03f325294a7c3ac354dc74d4768c4c96db5e", default-features = false }
    
    # MLMF removed 2026-07-29. Every published version (crates.io 0.2.0, the
    # v0.2.1 tag, and 0.3.0 at HEAD) depends on candle-core/candle-nn 0.9.2
    # directly, not on candlelight — so its `VarBuilder` was a different type
    # than `Llama::load` accepts, and `load_local_llama` could not compile.
    # MLMF additionally requires `protoc` at build time. Weight loading now
    # goes through candlelight's `VarBuilder::from_mmaped_safetensors`, the
    # pattern `load_awq_llama` already used. See src/loaders/mod.rs.

    # Fuel — the ML framework Lightbulb is porting ONTO. Lives alongside
    # candlelight during the port; candlelight is deleted once model_fuel/
    # reaches parity (see docs/superpowers/specs/2026-07-28-fuel-port-design.md).
    #
    # MUST be the git dependency: `fuel-core` on crates.io is an UNRELATED
    # project (the Fuel blockchain client, v0.48.x). `cargo add fuel-core`
    # silently pulls the wrong crate.
    # GIT deps pinned to an exact rev. These were absolute Windows PATH deps to a
    # local worktree during the port — fine on one machine, unbuildable anywhere
    # else, which is exactly what a public PR exposed.
    #
    # PINNED, not floating: `fuel`'s main moved six times on 2026-08-06 alone,
    # including one revision where `fuel-core` did not compile under
    # `--features cuda` at all. A branch dependency would make this crate's
    # buildability a function of when you cloned it.
    #
    # `2d0c04b7` is the rev every test here was verified against: 812 passed,
    # 0 failed, 68 ignored, 32 suites, identical to the pre-bump baseline.
    # Verified AT THE REV rather than at `origin/main`, which had already moved
    # five commits past it by the time this landed -- all mechanical (a
    # `cargo fmt --all` landing, a blame-ignore file, hooks tooling, a docs
    # note), none touching the API surface.
    #
    # The predecessor `8771997e` is the rev that repaired the CUDA break above,
    # and it is kept here as history, NOT as a baseline. It predates Fuel's
    # GAP-182, so it carried a HIGH (`libyml`, unsound + unmaintained, no patch)
    # and a MEDIUM (`serde_yml`) advisory into this crate; both are cleared at
    # `2d0c04b7`, and the replacement `unsafe-libyaml 0.2.11` is past
    # GHSA-r24f-hg58-vfrw's 0.2.10 fix.
    #
    # Bump it deliberately, with a re-run, not as a drive-by -- and UPDATE THIS
    # PARAGRAPH WHEN YOU DO. A comment naming a tested baseline is a factual
    # claim with no compiler behind it: this one asserted `8771997e` for one
    # commit after the manifest already said otherwise, which would have pointed
    # the next reader at a rev 651 commits stale.
    #
    # LOCAL DEVELOPMENT against a Fuel checkout: do NOT edit these lines back to
    # paths. Add a gitignored `.cargo/config.toml` instead —
    #     paths = ["../fuel-lightbulb-port"]
    # — which overrides the git source without touching the manifest, so a
    # working tree stays publishable.
    fuel             = { git = "https://github.com/ciresnave/fuel", rev = "2d0c04b71b456d313d6873f7099866c38e63a0ba", package = "fuel-core" }
    fuel-cpu-backend = { git = "https://github.com/ciresnave/fuel", rev = "2d0c04b71b456d313d6873f7099866c38e63a0ba" }
    # Only used to CONSTRUCT a `CudaDevice` in the GPU measurement harness.
    # `fuel-core` provides `impl From<CudaDevice> for Device` (its `cuda_backend`
    # module) but re-exports only `builder_arg`, not `CudaDevice` itself — so a
    # consumer that wants to name a GPU must depend on the backend crate.
    #
    # A regular optional dependency rather than a dev-dependency because Cargo
    # rejects optional dev-dependencies outright ("dev-dependencies are not
    # allowed to be optional"), and a PLAIN dev-dependency would run nvcc on
    # every `cargo test` including CPU-only ones. Optional + feature-activated
    # keeps default builds free of it entirely.
    fuel-cuda-backend = { git = "https://github.com/ciresnave/fuel", rev = "2d0c04b71b456d313d6873f7099866c38e63a0ba", optional = true }

[[bin]]
name = "lightbulb-cli"
path = "src/bin/lightbulb-cli.rs"

# The probe runs a model in-process, so it links the library the way
# `src/main.rs` does. It is deliberately NOT a subcommand of `lightbulb-cli`:
# that binary is a pure HTTP client (zero `lightbulb::` references) and giving
# it an engine dependency would put CUDA link requirements on a tool whose job
# is to talk to a server.
[[bin]]
name = "lightbulb-probe"
path = "src/bin/lightbulb-probe.rs"

[dev-dependencies]
# kiss-ref: spec-exact reference implementation of the KISS base-op vocabulary,
# used as the port's INDEPENDENT differential target (tiers 1 and 2 of the
# oracle). Differential target, never a verdict source — a disagreement means
# "determine which of us is wrong".
# 0.2.0 brings Node::ConstBits (exact bit patterns for tier-1 edge cases),
# R10-R14 reference fragments, and the ScalarFloat seal — the property that
# stops kiss-ref mirroring a consumer's own arithmetic back as agreement.
kiss-ref-core  = "0.2.0"
kiss-ops-vocab = "0.2.0"
# fuel-inference: the serving drivers (PagedSessionScheduler and friends).
# DEV-only on purpose — Lightbulb's library does not depend on Fuel's scheduler,
# it has its own. This is here so the A/B harness in tests/paged_plan_once.rs can
# drive Fuel's paged decode path directly and measure the plan-once flag.
fuel-inference = { git = "https://github.com/ciresnave/fuel", rev = "2d0c04b71b456d313d6873f7099866c38e63a0ba" }
tempfile       = "3"
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64         = "0.22"
criterion      = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "batched_inference_benchmark"
harness = false

# `github.com/ciresnave/candle` does not exist (404) and never did — CireSnave,
# 2026-09-24: "Candle is github.com/huggingface/candle if I'm not mistaken. I
# may have had a temporary fork of their code but I never made any changes to
# it so anything pointing at github.com/ciresnave/candle can be safely
# redirected to HuggingFace's Candle repo." Neither this manifest nor
# candlelight's declares that URL directly — it comes from `candle-layer-norm`
# (github.com/ciresnave/candle-layer-norm, a SEPARATE repo this crate does not
# own): `candle-core = { git = "https://github.com/ciresnave/candle.git",
# branch = "main", package = "candle-core", features = ["cuda"] }`, no version
# constraint. `cargo metadata --locked` (the `gates` CI job's "Cargo.lock
# matches the manifests" step) resolves the FULL locked graph regardless of
# which features are active by default — Cargo.lock must satisfy every
# optional dependency reachable through ANY feature combination declared in
# this manifest, not just the ones active today, precisely so enabling a
# feature later never needs network access. So it hits this dead source even
# though Lightbulb's own default build never activates `layer-norm`. Red on
# `main` since 2026-09-11 (root-caused 2026-09-24, `gates` run 107869908976).
#
# ⚠️ A `[patch]` ON candle-core ITSELF DOES NOT WORK — TESTED, NOT ASSUMED.
# `[patch."https://github.com/ciresnave/candle.git"] candle-core = "0.11.0"`
# (matching candlelight's own crates.io version) looked like the obvious fix
# and passed locally on the first try — because this machine still had a
# cached git checkout of the dead repo from before it went 404. Moving that
# cache aside and re-running reproduced the exact CI failure: cargo still
# tries to fetch `candle.git` to resolve `candle-layer-norm`'s manifest before
# a patch on `candle-core` can even apply, because the git dependency floats
# on `branch = "main"` rather than a pinned `rev` — a plain `[patch]` on the
# dependency name does not stop cargo probing the ORIGINAL source first. A
# CI-clean local test needs the cache removed; a green run with it present is
# not evidence.
#
# WHAT ACTUALLY WORKS: patch `candle-layer-norm` ITSELF (a live, reachable
# repo — only its `candle-core` dependency points at the dead URL) to the
# crates.io release upstream already publishes. Patching the DEPENDENT means
# cargo substitutes the whole package, including its manifest, without ever
# needing to read the original's Cargo.toml — so `candle.git` is never
# touched. Verified with the dead repo's git cache removed (a clean-CI
# simulation): `cargo metadata --locked` exits 0, zero remaining references
# to `ciresnave/candle.git` in Cargo.lock, `cargo update -p candle-layer-norm`
# touched exactly 6 package names (bindgen_cuda, candle-core, candle-kernels,
# candle-layer-norm, candle-ug, fancy-regex) — but that count is not the whole
# story, corrected here rather than caveated:
#
# ⚠️ THE SAME `cargo update -p candle-layer-norm` ALSO RE-POINTED 12 UNRELATED
# DEPENDENCY EDGES to an OLDER windows-sys — measured by diffing this
# manifest's lockfile against `main`'s package-by-package, not just reading
# `cargo update`'s own change summary (which reports package version
# add/remove events, not edge reassignments among ALREADY-PRESENT versions —
# a real blind spot in that output, not a manual miscount). None of the 12
# affected packages (rustix, tempfile, errno, quinn-udp, dirs-sys,
# is-terminal, nu-ansi-term, socket2, winapi-util, anstyle-query,
# anstyle-wincon, rustls-platform-verifier) changed VERSION — cargo's
# resolver simply chose a different, already-coexisting windows-sys entry
# for their edge on this particular resolve, a legal-but-gratuitous
# tie-break with nothing forcing it. Caught by a full lockfile diff against
# `main` (PM's read, not mine originally), confirmed by checking that the
# named packages' own versions were unchanged before/after. Fixed by
# hand-correcting exactly those 12 edges back to `windows-sys 0.61.2` in the
# already-generated lockfile (the same version entry was already present and
# valid for all of them) — not by re-running `cargo update` again, which
# reproduced the same spurious reassignment deterministically on retry.
#
# Verified after the correction: `cargo metadata --locked` still exits 0,
# `cargo check` / `cargo check --features fuel-engine` / `cargo test --tests`
# all still pass, and a full diff against `main`'s Cargo.lock now contains
# ONLY the 6 candle-related package changes above plus their own direct
# transitive knock-on (cudarc 0.19.8 -> 0.18.2 for the one dependent that
# needs it, `half` gaining a direct edge, `ug-metal` moving within
# candle-ug's own feature set) — nothing unrelated remains.
#
# candle-layer-norm 0.0.1 (crates.io) is OLDER than the git-pinned 0.0.3 and
# pulls its own candle-core 0.9.2 rather than 0.11.0 — a different version
# coexisting in the graph, which Cargo already did for three other candle-core
# versions before this patch, so it costs nothing new. Nothing in this crate
# calls `candle-layer-norm` directly (Lightbulb never activates the
# `layer-norm` feature by default), so the version gap has no behavioural
# consequence for anything Lightbulb builds today.
#
# MINIMUM FIX, NOT AN UPGRADE PROJECT (CireSnave, 2026-09-24: "we're ditching
# Candle for Fuel, the only things we should need Candle crates for is
# historical records") — no candle-path code was touched to accommodate this,
# and CireSnave's fallback (repoint at github.com/huggingface/candle) was not
# needed.
#
# NONE OF THIS SURVIVES CANDLELIGHT'S DELETION once the Fuel port replaces it
# as the default serving path — this whole patch block goes with it.
[patch."https://github.com/ciresnave/candle-layer-norm"]
candle-layer-norm = "0.0.1"
