[package]
    description = "Lightbulb: an ML inference and training runner with an OpenAI-compatible API"
    edition     = "2024"
    license     = "MIT OR Apache-2.0"
    name        = "lightbulb"
    repository  = "https://github.com/ciresnave/lightbulb"
    version     = "0.23.15"

[features]
    # CUDA, via Fuel only. Was `["candlelight/cuda", "fuel/cuda"]`; candlelight
    # is gone (CireSnave, 2026-10-22: "Remove all dependencies on Candle and
    # Candlelight and then start fixing the errors that leaves" -- see
    # `chore/remove-candlelight`). `candlelight/cuda` never built on this
    # toolchain anyway (candle-kernels v0.10.2 vs CUDA 13.3's CCCL headers).
    cuda = ["fuel/cuda"]
    # Also pulls the dev-only `fuel-cuda-backend` so the GPU measurement harness
    # can construct a `CudaDevice`; see the dev-dependency comment. Now
    # identical to `cuda` above (both are Fuel-only since candlelight's
    # removal) -- kept as a separate name because call sites and CI already
    # name it; collapse into `cuda` in a later cleanup if nothing still
    # distinguishes them.
    fuel-cuda = ["fuel/cuda", "dep:fuel-cuda-backend"]
    # Vulkan, via Fuel.
    vulkan = ["fuel/vulkan"]
    # Was the opt-in flag selecting Fuel over candlelight as the serving path.
    # candlelight is gone, so this is a no-op kept for callers that still pass
    # it (CI's `gates` job among them) until they're updated to stop.
    fuel-engine = []
    default = []

[dependencies]
    ahash              = "0.8"
    anyhow             = "1"
    bytemuck           = "1.14"
    clap               = { version = "4", features = ["derive"] }
    ggml-quants        = "0.1.0"
    memmap2            = "0.9"
    mlmf-hf-layout     = "0.7.26"
    # Chat-template rendering. HuggingFace `chat_template` values are Jinja.
    # minijinja is pure Rust with no C dependencies, which keeps the CUDA build
    # unaffected.
    #
    # The feature list mirrors what `transformers` gives its own environment
    # (`utils/chat_template_utils.py`), because these templates are authored
    # against THAT dialect. Dropping one does not degrade rendering — it makes real
    # checkpoint templates fail to parse, which falls through to a registry guess
    # and reports success at a lower tier. That is the defect this work removes,
    # wearing a provenance field that says "guess".
    #
    #   macros        {% macro %}
    #   loop_controls {% break %} / {% continue %}  (transformers loads
    #                 jinja2.ext.loopcontrols for exactly this)
    #   json          the `tojson` filter
    #   serde         silences a deprecation warning; `context!` over serde types
    #                 is load-bearing here, not incidental
    #   debug         puts template source context into errors — spec §2 requires
    #                 a failing template log "which template failed and why"
    #
    # `loader` stays out: templates arrive as strings, never paths.
    minijinja          = { version = "2", features = ["macros", "loop_controls", "json", "serde", "debug"] }
    # Python method compatibility for the same templates. Jinja2's values ARE
    # Python objects, so `"x".startswith(...)`, `s.strip('\n')`, `s.split(...)`
    # and `d.items()` come free there; minijinja's do not, and it reports
    # "string has no method named startswith". Measured: Qwen3-8B's real
    # template fails at chat:20 without this, and Mistral-7B-Instruct-v0.3's
    # tools branch fails at `tool.items()`.
    #
    # `pycompat` is the module minijinja's own docs point at for this, wired
    # through `Environment::set_unknown_method_callback` in
    # `api/chat_template.rs`.
    #
    # Pinned to 2.23 rather than "2": `pycompat` did not exist in 2.0, and the
    # callback signature is tied to the `minijinja` version — both crates
    # resolve to the same 2.x release, so they must move together.
    minijinja-contrib  = { version = "2.23", features = ["pycompat"] }
    parking_lot        = "0.12"
    # Thin persistence layer over OpenDAL (crates.io, not git/path — CIRESNAVE-EXPECTATIONS §6.8).
    # Backs `cache::tiered_storage::FileDiskStore`'s disk tier; declares the needs it uses
    # (read/write/delete/atomic-replace) and is refused at open if the backend can't give them.
    persistant         = "0.9.24"
    rand               = "0.9"
    rayon              = "1.10"
    regex              = "1"
    serde              = { version = "1", features = ["derive"] }
    serde_json         = "1"
    sha2               = "0.10"
    thiserror          = "2"
    tokenizers         = { version = "0.21", default-features = false, features = ["onig"] }
    tokio              = { version = "1", features = ["macros", "rt-multi-thread"] }
    tokio-stream       = "0.1"
    tracing            = "0.1"
    tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
    uuid               = { version = "1.0", features = ["v4", "serde"] }

    # HTTP API dependencies
    axum               = { version = "0.8", features = ["tokio"] }
    axum-macros        = "0.5"
    hyper              = { version = "1.0", features = ["server", "http1", "http2"] }
    chrono             = { version = "0.4", features = ["serde"] }
    futures            = "0.3"
    futures-util       = "0.3"
    hex                = "0.4"
    reqwest            = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-manual-roots"] }
    persistant-sqlx       = "0.9.24"
    persistant-relational = "0.9.24"
    # Only to pick a `TlsPolicy` for `PgBackend::connect_with` from
    # `DATABASE_URL`'s own `sslmode` (and to recognize a loopback host) --
    # see `tls_policy_for` in `api/mod.rs`. `connect_with`'s pool bounds
    # (max_connections/acquire_timeout) are `persistant_sqlx::ConnectOptions`
    # fields, so no direct `sqlx` dependency is needed any more.
    url                = "2.5"
    tower-http         = { version = "0.6", features = ["cors", "trace", "request-id"] }

    # TLS/Certificate dependencies
    tokio-rustls       = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
    rustls             = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12", "std"] }
    ring               = "0.17"
    rustls-pemfile     = "2.1"
    rcgen              = { version = "0.14", default-features = false, features = ["ring"] }
    instant-acme       = { version = "0.8", default-features = false, features = ["ring"] }
    x509-parser        = "0.18"
    time               = { version = "0.3", features = ["parsing", "formatting"] }
    base64             = "0.22"
    hyper-util         = { version = "0.1", features = ["tokio", "server", "service"] }
    tower              = { version = "0.5", features = ["util"] }
    http-body-util     = "0.1"

    # Model Context Protocol implementation
    mocopr = "0.1"

    # Hardware detection and system analysis
    system-analysis = "0.3"

    # Candlelight removed (CireSnave, 2026-10-22: "Remove all dependencies on
    # Candle and Candlelight and then start fixing the errors that leaves").
    # Was `candlelight = { git = "https://github.com/ciresnave/candlelight",
    # rev = "d70a03f325294a7c3ac354dc74d4768c4c96db5e", default-features =
    # false }`. Full provenance/pinning history: `git log -p -- Cargo.toml`
    # around this line on `main` before `chore/remove-candlelight`.
    #
    # MLMF removed 2026-07-29 for an unrelated reason (every published version
    # depends on candle-core/candle-nn 0.9.2 directly, a VarBuilder mismatch);
    # revisit once a Fuel-based loader replaces the candlelight one this
    # comment used to point at.

    # Fuel — the ML framework backing the (now sole) serving path in
    # `src/model_fuel/` (candlelight was removed entirely 2026-10-22, PR #195).
    #
    # Published to crates.io as of Fuel 0.20.61 (2026-10-22, all 40 crates) --
    # moved off the git dependency this block used to be (history:
    # `git log -p -- Cargo.toml`, search for "d90b481" or "PINNED, not
    # floating" before this commit). The main package publishes under the
    # name `fuel` directly (no `package = "fuel-core"` rename needed, unlike
    # the git source) -- crates.io's own `fuel-core` (v0.48.x) is an UNRELATED
    # project (the Fuel blockchain client); `cargo add fuel-core` would
    # silently pull the wrong crate, but the name `fuel` itself is free and is
    # what this one publishes as.
    #
    # LOCAL DEVELOPMENT against a Fuel checkout: do not edit these lines back
    # to paths or git. Add a gitignored `.cargo/config.toml` instead —
    #     paths = ["../fuel-lightbulb-port"]
    # — which overrides the registry source without touching the manifest, so
    # a working tree stays publishable.
    fuel             = "0.25.10"
    fuel-cpu-backend = "0.25.10"
    # `LlamaConfig`/`LlamaModel`/`LlamaWeights` -- fuel's "fuel-core
    # dissolution" moved these out of `fuel::lazy` into this crate (one
    # architecture per crate). Every `fuel::lazy::Llama*` import in
    # `src/model_fuel/` goes through here.
    fuel-model-llama = "0.25.10"
    # `lazy_llama_full`/`lazy_quantized_llama`/`lazy_quantized_qwen3` (the
    # config/quantized-model types `model_fuel/loader.rs` and
    # `loader_gguf*.rs` build on) live in this crate's `models` module, not in
    # `fuel` itself -- same dissolution as above.
    fuel-transformers = "0.25.10"
    # `fuel_loaders::quantized::config_from_gguf::derive_config` -- the
    # architecture-parameterized GGUF config reader `src/model_fuel/
    # loader_gguf*.rs` builds on. Reads the file through fuel's OWN
    # `gguf_file::Content`, a metadata-only parse distinct from
    # `crate::gguf::Content` (Lightbulb's reader, kept for the tokenizer
    # extraction `derive_config` deliberately does not do).
    fuel-loaders = "0.25.10"
    # `fuel_ir::probe::BackendId` and `fuel_ir::backend::TransferPath` —
    # neither is re-exported through the `fuel` facade (its `lib.rs` has no
    # `pub use fuel_ir::...` at all; it only re-exports the SPECIFIC fuel_ir
    # items it needs under its own names, e.g. `DeviceLocation`). Needed by
    # `multi_gpu::topology::DeviceTopology::discover` to filter `ProbeReport`'s
    # descriptors to CUDA and read real P2P status off
    # `SystemTopology::transfer_path`. `ProbeReport`/`SystemTopology`/
    # `TransferEstimate` themselves ARE reachable via the facade
    # (`fuel::probe`, `fuel::topology`, `fuel::transfer_cost`), so this is the
    # only reason for a direct dependency on this crate.
    fuel-ir = "0.25.10"
    # `BackendRuntime` (`available_bytes` / `would_fit`) and `DynBackendDevice::as_backend_runtime`,
    # which `src/model_fuel/preflight.rs` calls and `fuel` does not re-export.
    fuel-backend-contract = "0.25.10"
    # `multi_session::SessionScheduler` + `DecodeModel` — the batched
    # multi-session decode driver `src/model_fuel/scheduler_driver.rs` wires
    # in. Consistent with the rest of this block: `fuel`/`fuel-transformers`/
    # etc. are already unconditional real dependencies regardless of the
    # (now no-op) `fuel-engine` feature flag.
    fuel-inference = "0.25.10"
    # Only used to CONSTRUCT a `CudaDevice` in the GPU measurement harness.
    # `fuel` provides `impl From<CudaDevice> for Device` (its `cuda_backend`
    # module) but re-exports only `builder_arg`, not `CudaDevice` itself — so a
    # consumer that wants to name a GPU must depend on the backend crate.
    #
    # A regular optional dependency rather than a dev-dependency because Cargo
    # rejects optional dev-dependencies outright ("dev-dependencies are not
    # allowed to be optional"), and a PLAIN dev-dependency would run nvcc on
    # every `cargo test` including CPU-only ones. Optional + feature-activated
    # keeps default builds free of it entirely.
    fuel-cuda-backend = { version = "0.25.10", optional = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
    # `metrics` is a pure facade (the `gauge!`/`counter!` macros record
    # against a global recorder, with no dependencies of their own beyond
    # that). `metrics-exporter-prometheus` default-features pulls in its
    # own `http-listener` (a second hyper server) and `push-gateway`
    # (reqwest+rustls+aws-lc-rs) -- neither applies here: `/metrics` is
    # served through the existing axum router (`PrometheusHandle::render`),
    # not a second listener, and nothing pushes to a gateway. Disabling
    # defaults keeps aws-lc-rs out of the tree, which this project removed
    # once already (see the "Replace aws-lc-rs with ring" commit).
    metrics = "0.24"
    metrics-exporter-prometheus = { version = "0.18", default-features = false }

[[bin]]
name = "lightbulb-cli"
path = "src/bin/lightbulb-cli.rs"

# The probe runs a model in-process, so it links the library the way
# `src/main.rs` does. It is deliberately NOT a subcommand of `lightbulb-cli`:
# that binary is a pure HTTP client (zero `lightbulb::` references) and giving
# it an engine dependency would put CUDA link requirements on a tool whose job
# is to talk to a server.
[[bin]]
name = "lightbulb-probe"
path = "src/bin/lightbulb-probe.rs"

[dev-dependencies]
# Dev-only as of PersistAnt adoption Step 5: the app itself no longer uses
# these (deadpool-postgres/tokio-postgres/refinery are gone from
# [dependencies]), but tests/persistant_migrate_tests.rs still needs a raw
# driver to (a) simulate a pre-Step-5 deployment's refinery-migrated
# database -- a real upgrade scenario worth testing even though the
# shipped binary no longer runs refinery itself -- and (b) inspect the
# resulting schema directly (information_schema/pg_indexes), independent
# of persistant_sqlx's own Value-typed query path.
tokio-postgres = "0.7"
refinery       = { version = "0.9", features = ["tokio-postgres"] }
# tests/api_integration_tests.rs's own test setup/verification helpers also
# use tokio_postgres directly (provisioning keys, checking revoked-key
# state) and bind/read `uuid::Uuid` params -- tokio_postgres has no
# built-in Uuid support, hence this.
postgres-types = { version = "0.2", features = ["with-uuid-1"] }
# kiss-ref: spec-exact reference implementation of the KISS base-op vocabulary,
# used as the port's INDEPENDENT differential target (tiers 1 and 2 of the
# oracle). Differential target, never a verdict source — a disagreement means
# "determine which of us is wrong".
# 0.4.0 (breaking: Node/NumericKind/Family/etc. gained #[non_exhaustive];
# diff's NaN quietness check tightened to Tolerance::Exact; reduce_var/std
# changed to the deviations-about-the-mean form; comparison result dtype is
# now bool). This file's recipes use Monoid::Sum (not reduce_var/std), no
# exhaustive match on Node/Family, and no Tolerance::Exact diff call, so none
# of the 0.4.0 breaking changes apply to this file's usage — verified by
# running the suite after the bump, not assumed.
kiss-ref-core  = "0.4.0"
kiss-ops-vocab = "0.4.0"
tempfile       = "3"
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64         = "0.22"
criterion      = { version = "0.8", features = ["html_reports"] }
# Writes the tiny synthetic Llama checkpoints used by the checkpoint/GGUF
# #[ignore] fixture plan (docs/CHECKPOINT_FIXTURE_FEASIBILITY.md) -- already
# in the dependency graph transitively (fuel reads safetensors at runtime),
# this just makes it a direct dep so test code can write one.
safetensors    = "0.8"

# `batched_inference_benchmark` bench removed 2026-10-22 (candlelight
# removal): entirely ParallelModelManager-based, which was removed in the
# same pass. See docs/FUEL-GAPS-FROM-CANDLE-REMOVAL.md.

