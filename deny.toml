# cargo-deny policy (portfolio rule: CI and branch protection everywhere,
# CIRESNAVE-EXPECTATIONS.md §6.5). Run by CI (`cargo deny check`); mirrors
# coderipper's/UniSQL's deny.toml shape. Licences are permissive only.
[graph]
all-features = true

[advisories]
version = 2
# Real vulnerabilities still fail the job (the whole point of this gate).
# `unmaintained = "none"` and `yanked = "warn"` mirror `cargo audit`'s own
# existing default behavior on this tree (4 unmaintained crates --
# number_prefix/paste/rustls-pemfile/unsafe-libyaml -- plus a yanked
# `chacha20 0.10.1` pulled transitively via `rand`/Fuel's own tree, all
# already present and already non-blocking under `cargo audit`'s defaults,
# 2026-10-23) rather than introducing a stricter new failure mode for
# pre-existing, not-independently-actionable findings on day one of this job.
unmaintained = "none"
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unlicense",
    "0BSD",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Not in coderipper's/UniSQL's own allow-list -- added here because
    # lightbulb's real tree needs them (cssparser/cssparser-macros/
    # dtoa-short/option-ext/selectors use MPL-2.0; tiny-keccak uses
    # CC0-1.0), confirmed by `cargo deny check licenses` against this repo,
    # not copied blind. MPL-2.0 is file-level (weak) copyleft, not whole-
    # program; CC0-1.0 is public-domain-equivalent. Flagged to the PM as a
    # policy deviation from the mirrored template, not a silent one.
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
