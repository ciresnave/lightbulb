# ---------------------------------------------------------------------------------------------------------------------------------
# The `[architecture]` declaration (ARC/MOD programme, CireSnave 2026-11-12). NORMATIVE: it says where things should sit; where the
# code disagrees, the edge is either a finding or a dated waiver below. Components are the top-level modules of the one crate.
# Layer order is bottom first; a component may depend on its own layer or any layer below it.
# Measured 2026-11-12 at main f01b123 by scanning `crate::<top>::` paths (not a type-resolved graph): 22 top-level modules, the
# only upward edges are the ones waived at the end. Owner: the lightbulb lane.
